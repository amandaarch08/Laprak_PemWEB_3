<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Nilai – Portofolio Mahasiswa</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="kalkulator.css" />
</head>
<body>

  <!-- ═══ NAVIGASI BAR ═══ -->
  <nav>
    <a href="index.html" class="nav-brand">portofolio.mahasiswa/ITFLN</a>
    <ul class="nav-links">
      <li><a href="index.html">Tentang Saya</a></li>
      <li><a href="kalkulator.html" class="active">Kalkulator Nilai</a></li>
    </ul>
  </nav>

  <!-- ═══ KONTEN UTAMA ═══ -->
  <div class="container">

    <!-- Pesan Sambutan (diisi oleh window.onload di kalkulator.js) -->
    <div class="welcome-banner" id="welcome-banner"></div>

    <!-- CARD KALKULATOR -->
    <div class="card">

      <div class="calc-header">
        <h2>Kalkulator Nilai Akhir</h2>
        <p>Masukkan tiga komponen nilai untuk menghitung nilai akhir dan grade.</p>
      </div>

      <!-- Bobot Penilaian -->
      <div class="bobot-row">
        <div class="bobot-item">
          <span class="bobot-persen">30%</span>
          <span class="bobot-nama">Tugas</span>
        </div>
        <div class="bobot-item">
          <span class="bobot-persen">30%</span>
          <span class="bobot-nama">UTS</span>
        </div>
        <div class="bobot-item">
          <span class="bobot-persen">40%</span>
          <span class="bobot-nama">UAS</span>
        </div>
      </div>

      <!-- INPUT NILAI -->
      <div class="form-group">
        <label for="input-tugas">Nilai Tugas</label>
        <input type="number" id="input-tugas" placeholder="Contoh: 85" min="0" max="100" />
      </div>

      <div class="form-group">
        <label for="input-uts">Nilai UTS</label>
        <input type="number" id="input-uts" placeholder="Contoh: 78" min="0" max="100" />
      </div>

      <div class="form-group">
        <label for="input-uas">Nilai UAS</label>
        <input type="number" id="input-uas" placeholder="Contoh: 80" min="0" max="100" />
      </div>

      <!-- PESAN ERROR (tersembunyi secara default) -->
      <div class="error-message" id="error-message"></div>

      <!-- TOMBOL HITUNG -->
      <button class="btn btn-primary" id="btn-hitung">Hitung</button>

      <!-- HASIL (tersembunyi sebelum tombol ditekan) -->
      <div class="hasil-section" id="hasil-section">
        <p class="hasil-label">Nilai Akhir</p>
        <p class="hasil-nilai-angka" id="hasil-nilai">0</p>
        <div class="grade-badge grade-A" id="hasil-grade">A</div>
        <p class="grade-keterangan" id="hasil-keterangan"></p>
      </div>

    </div><!-- /card -->

  </div><!-- /container -->

  <!-- JavaScript diload di akhir body -->
  <script src="kalkulator.js"></script>

</body>
</html>
